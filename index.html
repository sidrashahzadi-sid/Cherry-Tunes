<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cherry Tunes | Music Player</title>
</head>
<body>
    <div class="music-player">
        <h1>Cherry Tunes</h1>
        <p>Your little escape through music.</p>
        <div class="album-cover">
            <img src="https://placehold.co/300x300/F8D7E3/70263B?text=Cherry+Tunes" alt="Cherry Tunes Album Cover">
        </div>
        <div class="song-info">
            <h2 id="song-title">Midnight Dreams</h2>
            <p id="artist-name"> Cherry Moon</p>
        </div>
        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>
        <div class="controls">
            <button type="button" id="previous-btn" aria-label="Previous Song"><i class="fa-solid fa-backward-step"></i></button>
            <button type="button" id="play-Btn" aria-label="Play Music"><i class="fa-solid fa-play"></i></button>
           <button type="button" id="next-btn" aria-label="Next Song"><i class="fa-solid fa-forward-step"></i></button>
    </div>
    <audio id="audio" src="music4.mp3"></audio>
</div>
    <script src="script.js"></script>
</body>
</html>
